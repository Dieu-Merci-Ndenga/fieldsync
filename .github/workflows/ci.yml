name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: fieldsync, POSTGRES_PASSWORD: fieldsync, POSTGRES_DB: fieldsync }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fieldsync" --health-interval 3s --health-retries 10
    env:
      DATABASE_URL: postgres://fieldsync:fieldsync@localhost:5432/fieldsync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - run: npm ci --prefix backend
      - run: npm run build --prefix backend
      - run: npm test --prefix backend -- --runInBand

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - run: npm ci --prefix backend
      - run: npm ci --prefix mobile
      - run: npm run typecheck --prefix mobile
      - run: npm test --prefix mobile

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: curl --fail http://localhost:3000/health
      - run: docker compose down -v
